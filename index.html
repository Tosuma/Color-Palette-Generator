<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the theme before first paint to avoid a light flash in dark mode.
    (function () {
      let theme;
      try { theme = JSON.parse(localStorage.getItem('palette-generator-state')).theme; } catch {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="toolbar">
    <h1 class="title">Palette</h1>

    <div class="toolbar-group">
      <button id="generate" class="btn btn-primary" title="Generate new colors (Space)">Try new colors</button>
      <button id="add" class="btn">+ Add color</button>
    </div>

    <div class="toolbar-group">
      <label class="field">
        Harmony
        <select id="harmony" class="select">
          <option value="random">Random</option>
          <option value="analogous">Analogous</option>
          <option value="complementary">Complementary</option>
          <option value="split-complementary">Split complementary</option>
          <option value="triadic">Triadic</option>
          <option value="tetradic">Tetradic</option>
          <option value="monochrome">Monochrome</option>
        </select>
      </label>
      <label class="toggle" title="Build new colors around the first locked color">
        <input id="match-locked" type="checkbox" role="switch" />
        <span class="toggle-track" aria-hidden="true"></span>
        Match locked colors
      </label>
    </div>

    <div class="toolbar-group">
      <div class="segmented" role="group" aria-label="View mode">
        <button class="seg-btn" data-view="columns">Columns</button>
        <button class="seg-btn" data-view="grid">Grid</button>
      </div>
      <label id="grid-size-wrap" class="grid-size">
        Columns per row
        <input id="grid-size" type="range" min="1" max="8" step="1" />
        <span id="grid-size-value"></span>
      </label>
    </div>

    <p class="hint">Press <kbd>Space</kbd> to generate</p>

    <button id="theme" class="btn theme-btn" aria-label="Toggle dark background"></button>
  </header>

  <main id="palette" class="palette"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
